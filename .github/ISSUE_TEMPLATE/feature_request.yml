name: Feature request
description: Suggest an idea for QuotaCrew
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that's hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Continuity / goals
        - Accounts / quota
        - Switching / recovery
        - GUI
        - CLI
        - Diagnostics
        - Packaging / installer
        - Other
